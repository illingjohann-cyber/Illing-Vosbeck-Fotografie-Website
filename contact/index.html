<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt – Illing &amp; Vosbeck Fotografie</title>
    <link rel="preload" href="../assets/fonts/source-sans-3-700.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="../style.css?v=24">
    <script src="../main.js?v=24" defer></script>
</head>
<body>
    <header class="site-header">
        <a href="../index.html" class="logo">
            <img src="../assets/index/images/iv-logo-3.png" width="337" height="164" alt="Illing &amp; Vossbeck Fotografie">
        </a>
        <span class="site-version" aria-hidden="true"></span>
        <nav class="main-nav">
            <a href="../about/index.html">about</a>
            <a href="../contact/index.html" aria-current="page">contact</a>
        </nav>
    </header>

    <main class="page">
        <section class="page-intro reveal">
            <h1 class="display-name">Kontakt</h1>
            <p class="page-intro__label">Anke Illing · Porträtfotografie</p>
        </section>

        <section class="contact" id="kontakt">
            <div class="contact__intro reveal">
                <h2 class="contact__title">Projekt anfragen</h2>
                <p>Welches Projekt möchten Sie visualisieren? Schreiben Sie mir – ich melde mich zeitnah bei Ihnen für ein unverbindliches Kennenlerngespräch.</p>
            </div>

            <!-- Das Formular ist noch nicht mit einem Versanddienst verbunden -->
            <form class="contact-form reveal" novalidate>
                <div class="field">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" autocomplete="name" required>
                </div>
                <div class="field">
                    <label for="email">E-Mail</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </div>
                <div class="field">
                    <label for="company">Unternehmen <span class="field__optional">(optional)</span></label>
                    <input type="text" id="company" name="company" autocomplete="organization">
                </div>
                <div class="field">
                    <label for="message">Nachricht</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>

                <label class="consent">
                    <input type="checkbox" name="consent" required>
                    <span>Ich bin damit einverstanden, dass meine Angaben zur Beantwortung meiner Anfrage verarbeitet werden.</span>
                </label>

                <button type="submit" class="cta">
                    <span>Nachricht senden</span>
                    <span class="cta__arrow" aria-hidden="true">→</span>
                </button>

                <p class="contact-form__status" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>
    <footer class="site-footer">
        <p class="site-footer__copy">© 2026 Anke Illing</p>
        <nav class="site-footer__links" aria-label="Footer">
            <!-- Impressum-Seite und LinkedIn-Profil-URL noch eintragen -->
            <a href="#">Impressum</a>
            <a href="#" class="site-footer__linkedin" target="_blank" rel="noopener">
                <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z"/></svg>
                LinkedIn
            </a>
        </nav>
    </footer>
</body>
</html>
