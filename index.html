<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Illing &amp; Vosbeck Fotografie</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/main.js" defer></script>
</head>
<body>
    <header class="site-header">
        <a href="index.html" class="logo">LOGO</a>
        <nav class="main-nav">
            <a href="#about">about</a>
            <a href="#contact">contact</a>
        </nav>
    </header>

    <main class="hero">
        <figure class="hero__portrait reveal">
            <img
                src="https://tillmannfranzen.com/wordpress/wp-content/uploads/2026/03/01_TFranzen_Dornbracht_RCrftd-1024x1536.webp"
                width="1024" height="1536"
                alt="Armaturen unter fließendem Wasser">
        </figure>

        <div class="hero__right">
            <p class="hero__intro reveal">
                Ich bin Fotograf für Unternehmen und Kreativagenturen. Mit mehr als 25 Jahren
                internationaler Erfahrung entwickle ich Bilder, die Vertrauen schaffen und
                Markenidentität spürbar machen. Ungestellt, präzise und ausdrucksstark.
            </p>
            <figure class="hero__landscape reveal">
                <img
                    src="https://tillmannfranzen.com/wordpress/wp-content/uploads/2026/03/03_TFranzen_Dornbracht_RCrftd-1024x683.webp"
                    width="1024" height="683"
                    alt="Bauteil wird aus einem Galvanikbad gehoben">
            </figure>
        </div>
